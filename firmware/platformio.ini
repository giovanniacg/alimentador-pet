; Alimentador Pet - firmware ESP32
;
; Dois modos. Escolha o env na hora de gravar:
;   pio run -e loop -t upload    liga na tomada e gira sozinho (teste de campo)
;   pio run -e menu -t upload    comandos por serial e pagina web
;
; Depois que o modo menu tiver WiFi, da pra gravar pela rede, sem cabo:
;   pio run -e menu-ota -t upload --upload-port alimentador.local

; ---- modo LOOP: liga na tomada e gira sozinho, 10s de cada lado ----
; pio run -e loop -t upload
[env:loop]
extends = env:base
build_src_filter = +<modo_loop.cpp>

; ---- modo GIRO: um sentido so, continuo, para diagnostico ----
; pio run -e giro -t upload
[env:giro]
extends = env:base
build_src_filter = +<modo_giro.cpp>

; ---- modo DIAG: descobre em qual GPIO o STP esta ligado ----
; pio run -e diag -t upload
[env:diag]
extends = env:base
build_src_filter = +<modo_diag.cpp>

; ---- modo TUTORIAL: bit-bang com pulso largo, varre larguras e pinos ----
; pio run -e tutorial -t upload
[env:tutorial]
extends = env:base
build_src_filter = +<modo_tutorial.cpp>

; ---- modo SINAL: LED prova que o STEP pulsa, motor gira continuo ----
; pio run -e sinal -t upload
[env:sinal]
extends = env:base
build_src_filter = +<modo_sinal.cpp>

; ---- modo RAMPA: acelera de 7 a 30 RPM, assume 1/8 de micropasso ----
; pio run -e rampa -t upload
[env:rampa]
extends = env:base
build_src_filter = +<modo_rampa.cpp>

; ---- modo CRU: codigo canonico de tutorial, full step, sem rampa ----
; pio run -e cru -t upload
[env:cru]
extends = env:base
build_src_filter = +<modo_cru.cpp>

; ---- modo TESTE: teste integrado de todos os componentes montados ----
; pio run -e teste -t upload
[env:teste]
extends = env:base
build_src_filter = +<modo_teste.cpp>
lib_deps =
    waspinator/AccelStepper@^1.64
    bogde/HX711@^0.7.5
    adafruit/RTClib@^2.1.4

; ---- modo MENU: comandos por serial e pagina web ----
; pio run -e menu -t upload
[env:menu]
extends = env:base
build_src_filter = +<modo_menu.cpp>

[env:base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; So o que a fase atual usa. As demais entram junto com a fase:
;   fase 03 (balanca)  -> bogde/HX711
;   fase 04 (relogio)  -> adafruit/RTClib + SPI + Wire  (exige lib_ldf_mode = deep+)
;   fase 06 (broker)   -> knolleary/PubSubClient + bblanchon/ArduinoJson
lib_deps =
    waspinator/AccelStepper@^1.64

lib_ldf_mode = deep+

build_flags =
    -D CORE_DEBUG_LEVEL=3

; grava pela rede (so faz sentido no modo menu, que tem WiFi)
[env:menu-ota]
extends = env:menu
upload_protocol = espota
