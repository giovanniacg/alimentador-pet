; Alimentador Pet - firmware ESP32
;
; Gravar pela primeira vez (cabo USB):
;   pio run -t upload
; Depois disso, pela rede (sem cabo):
;   pio run -e esp32dev-ota -t upload --upload-port alimentador.local

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; So o que a fase atual usa. As demais entram junto com a fase:
;   fase 03 (balanca)  -> bogde/HX711
;   fase 04 (relogio)  -> adafruit/RTClib + SPI + Wire  (exige lib_ldf_mode = deep+)
;   fase 06 (broker)   -> knolleary/PubSubClient + bblanchon/ArduinoJson
lib_deps =
    waspinator/AccelStepper@^1.64

lib_ldf_mode = deep+

build_flags =
    -D CORE_DEBUG_LEVEL=3

; grava pela rede: use com --upload-port alimentador.local
[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
