; Alimentador Pet - firmware ESP32
; Fases 00-04 nao precisam de rede: compile com -D FASE_BANCADA

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    waspinator/AccelStepper@^1.64
    bogde/HX711@^0.7.5
    adafruit/RTClib@^2.1.4
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=3
