services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: alimentador-mqtt
    restart: unless-stopped
    volumes:
      - ./config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      # WebSocket seguro: e por aqui que ESP32 e app entram
      - traefik.http.routers.mqtt.rule=Host(`${MQTT_HOST}`)
      - traefik.http.routers.mqtt.entrypoints=https
      - traefik.http.routers.mqtt.tls=true
      - traefik.http.routers.mqtt.tls.certresolver=letsencrypt
      - traefik.http.services.mqtt.loadbalancer.server.port=9001

volumes:
  mosquitto-data:

networks:
  web:
    external: true
