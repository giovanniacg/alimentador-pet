# Mosquitto - Alimentador Pet
# Escuta apenas dentro da rede Docker. O Traefik publica com TLS na 443.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type error
log_type notice
log_type information
connection_messages true

# Sem acesso anonimo, sempre.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# MQTT nativo - uso interno e diagnostico
listener 1883
protocol mqtt

# WebSocket - e por aqui que o Traefik entrega ESP32 e app
listener 9001
protocol websockets
